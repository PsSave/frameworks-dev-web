<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../static/css/list.css" />
    <title>List</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f4;
      }

      h1 {
        text-align: center;
        margin-top: 20px;
      }

      .grid-container {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
        background-color: #fff;
        border: 1px solid #ddd;
        border-radius: 5px;
      }

      .grid-header {
        font-weight: bold;
        background-color: #f0f0f0;
        padding: 10px;
        border: 1px solid #ddd;
        text-align: center;
        color: black;
      }

      .grid-item {
        padding: 10px;
        border: 1px solid #ddd;
        text-align: center;
        color: black;
      }

      .action-btn {
        padding: 5px 10px;
        margin: 2px;
        border: none;
        border-radius: 3px;
        cursor: pointer;
      }

      .action-btn.edit {
        background-color: #4caf50;
        color: white;
      }

      .action-btn.delete {
        background-color: #f44336;
        color: white;
      }
    </style>
  </head>

  <body>
    <h1>Items list</h1>
    <div class="grid-container">
      <div class="grid-header">ID</div>
      <div class="grid-header">Name</div>
      <div class="grid-header">Surname</div>
      <div class="grid-header">Email</div>
      <div class="grid-header">Actions</div>
      <script>
        const gridContainer = document.querySelector(".grid-container");
        for (let i = 1; i <= 997; i++) {
          gridContainer.innerHTML += `
          <div class="grid-item">${i}</div>
          <div class="grid-item">Name ${i}</div>
          <div class="grid-item">Surname ${i}</div>
          <div class="grid-item">user${i}@example.com</div>
          <div class="grid-item">
            <button class="action-btn edit">Edit</button>
            <button class="action-btn delete">Delete</button>
          </div>
        `;
        }
      </script>
    </div>
  </body>
</html>
